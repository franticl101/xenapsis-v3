name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancel superseded runs on the same ref rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (scoring)
        run: npm test

      # `build` runs the SEO guards during render and the site-wide audit after,
      # so a generic title, a missing description or a broken internal link
      # fails here rather than in a ranking report months later.
      - name: Build with SEO guards and audit
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end assessment checks
        run: npm run test:e2e

      - name: Core Web Vitals budgets
        run: npm run vitals

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
